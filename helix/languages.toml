# Thrax for Helix: merge into ~/.config/helix/languages.toml (or a project's
# .helix/languages.toml). The `config` table is sent as the server's options;
# its keys are the `[lsp]` keys of thrax.toml, which it overrides.
#
# Highlighting needs the tree-sitter grammar, generated from the Bison spec:
#   thxdo tree-sitter         # writes tools/editors/tree-sitter-thrax
#   hx --grammar build        # compiles it into Helix's runtime
# and the queries: link tools/editors/helix/queries/thrax to
# ~/.config/helix/runtime/queries/thrax. Point `source.path` below at your
# checkout.

[language-server.thrax]
command = "thrax"
args = ["lsp"]

[language-server.thrax.config.lsp]
check = "type"   # or "save"
focus = "roots"  # "all", "roots" or "one"

[[language]]
name = "thrax"
scope = "source.thrax"
file-types = ["thx"]
roots = ["thrax.toml"]
comment-token = "#"
indent = { tab-width = 4, unit = "    " }
language-servers = ["thrax"]
grammar = "thrax"
auto-format = false

[[grammar]]
name = "thrax"
source = { path = "/path/to/Thrax/tools/editors/tree-sitter-thrax" }
