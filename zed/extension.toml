id = "thrax"
name = "Thrax"
version = "0.1.0"
schema_version = 1
authors = ["Delyan Kirov"]
description = "Thrax: diagnostics, fixes, hover, completion and formatting from `thrax lsp`"
repository = "https://github.com/delyan-kirov/Thrax"

[language_servers.thrax]
name = "Thrax"
languages = ["Thrax"]

# Zed fetches the grammar with git at `rev` and compiles `path`/src/parser.c:
# after regenerating the grammar (`thxdo tree-sitter`) and committing it, point
# `rev` at that commit.
[grammars.thrax]
repository = "https://github.com/delyan-kirov/thrax-ide-extensions"
rev = "e5b90f0a9d33f4610c83a3d6ae8c533930579713"
path = "tree-sitter-thrax"
